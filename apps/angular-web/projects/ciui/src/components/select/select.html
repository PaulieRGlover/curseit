<ciui-input-info
  [id]="id()"
  [label]="label()"
  [labelInvisible]="labelInvisible()"
  [row]="row()"
/>

<div class="ciui-input__wrapper">
  <input
    #select
    ciuiContextMenuTrigger
    trigger="focus"
    [id]="id()"
    [attr.name]="name()"
    [attr.aria-label]="ariaLabel()"
    class="ciui-input__input"
    [formControl]="searchControl"
    (input)="isValueSelected.set(false)"
    (keydown.enter)="handleEnterPress()"
    (keydown.arrowUp)="handleFocusMove(-1)"
    (keydown.arrowDown)="handleFocusMove(1)"
    (click)="handleSearchClick()"
    (input)="handleSearchInput()"
    (change)="handleSearchChange($event)"
  >

  <ciui-context-menu
    [theme]="theme()"
    [size]="size()"
    symmetric
    class="ciui-select__context-menu"
  >
    <ul class="ciui-select__options">
      @for (option of filteredOptions(); track option.id) {
      <li
        [attr.title]="option[labelKey()]"
        class="ciui-select__option ciui-context-menu__item ciui-ellipsis"
        [class.ciui-context-menu__item--focused]="focusedIndex() === $index"
        (click)="handleSelect(option)"
        (mouseenter)="handleOptionHover(option)"
        (mousemove)="handleOptionHover(option)"
      >
        <span class="ciui-ellipsis__text">{{ option[labelKey()] }}</span>
      </li>
      }
    </ul>
  </ciui-context-menu>
</div>
