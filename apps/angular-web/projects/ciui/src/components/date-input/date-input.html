<ciui-input-info
  [id]="id()"
  [label]="label()"
  [labelInvisible]="labelInvisible()"
  [row]="row()"
/>

<div class="ciui-input__wrapper">
  <input
    #input
    [id]="id()"
    type="date"
    [attr.name]="name()"
    [attr.placeholder]="placeholder()"
    [attr.min]="min()"
    [attr.max]="max()"
    [attr.aria-label]="ariaLabel()"
    [attr.title]="formControl()?.value ?? value()"
    class="ciui-input__input"
    (blur)="onBlur()"
    (input)="$event.stopPropagation();"
    (change)="$event.stopPropagation(); onChange()"
    (keydown)="handleKeyDown($event)"
  />
</div>
