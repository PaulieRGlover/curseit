<ciui-input-info
  [id]="id()"
  [label]="label()"
  [labelInvisible]="labelInvisible()"
  [row]="row()"
/>

<div class="ciui-input__wrapper">
  <input
    #input
    [id]="id()"
    type="datetime-local"
    [attr.name]="name()"
    [attr.placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel()"
    [attr.title]="formControl().value"
    class="ciui-input__input"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
</div>
