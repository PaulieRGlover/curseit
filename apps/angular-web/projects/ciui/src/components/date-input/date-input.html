<ciui-input-info
  [id]="id()"
  [label]="label()"
  [labelInvisible]="labelInvisible()"
  [row]="row()"
/>

<div class="ciui-input__wrapper">
  <input
    #input
    [id]="id()"
    type="datetime-local"
    [attr.name]="name()"
    [attr.placeholder]="placeholder()"
    [attr.min]="min()"
    [attr.max]="max()"
    [attr.aria-label]="ariaLabel()"
    [attr.title]="formControl().value"
    class="ciui-input__input"
    (blur)="onBlur()"
    (change)="$event.stopPropagation()"
    (input)="$event.stopPropagation()"
  />
</div>
