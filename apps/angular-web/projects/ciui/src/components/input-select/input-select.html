<ciui-input-info
  [id]="inputId()"
  [label]="label()"
  [labelInvisible]="labelInvisible()"
  [row]="row()"
/>

<label [for]="selectId()" class="ciui-input__label ciui-a11y-hidden">{{ labelSelect() }}</label>

<div class="ciui-input__wrapper">
  <input
    #input
    [id]="inputId()"
    [type]="type()"
    [attr.name]="name()"
    [attr.placeholder]="placeholder()"
    [attr.min]="min()"
    [attr.max]="max()"
    [attr.step]="step()"
    [attr.autocomplete]="autocomplete()"
    [attr.aria-label]="ariaLabel()"
    class="ciui-input__input ciui-input-select__input"
    (input)="onInput()"
    (blur)="onBlur()"
  />

  <ciui-select
    [ariaLabel]="ariaLabelSelect()"
    [options]="options()"
    [formControl]="selectValue"
    [label]="label()"
    [size]="size()"
    labelInvisible
    class="ciui-input-select__select"
    (change)="onInput()"
  >
    <ng-template #icon let-isOpen="isOpen">
      <ciui-icon
        [name]="isOpen ? 'menu-up' : 'menu-down'"
        size="small"
        class="ciui-select__icon"
      />
    </ng-template>
  </ciui-select>
</div>
