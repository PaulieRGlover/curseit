<ciui-input-info
  [id]="id()"
  [label]="label()"
  [labelInvisible]="labelInvisible()"
  [row]="row()"
/>

<div class="ciui-input__wrapper">
  <input
    #input
    [id]="id()"
    [attr.type]="type()"
    [attr.name]="name()"
    [attr.placeholder]="placeholder()"
    [attr.min]="min()"
    [attr.max]="max()"
    [attr.autocomplete]="autocomplete()"
    [attr.aria-label]="ariaLabel()"
    class="ciui-input__input"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
</div>
