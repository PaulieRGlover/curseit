<form
  ciui-form
  class="cid-auth-form"
  [formGroup]="signUpData"
  [loading]="loading"
  (ngSubmit)="onSubmit()"
>
  <span ngProjectAs="ciui-form-title">Sign Up to CoolShrank</span>

  <ciui-input
    label="login"
    name="login"
    placeholder="email@domain.com"
    formControlName="login"
    [control]="signUpData.controls.login"
  />
  <ciui-input
    label="password"
    name="password"
    placeholder="_myStr0nG--pa55WORd//"
    type="password"
    formControlName="password"
    [control]="signUpData.controls.password"
  />

  <span ngProjectAs="ciui-form-submit">Sign Up</span>

  <div ngProjectAs="ciui-form-footer" class="cid-auth-form__navigation">
    or <a routerLink="../sign-in">Sign In</a>
  </div>
</form>
