<ciui-select
  #nutrientName
  label="Nutrient name"
  name="name"
  placeholder="Nutrient name"
  labelInvisible
  row
  theme="white-semi-transparent"
  labelKey="name"
  [options]="nutrientsSearchStore.foundNutrients() ?? []"
  [optionsLoading]="nutrientsSearchStore.loading()"
  [formControl]="nutrientForm.controls.core"
  (searchedDebounced)="handleSearch($event)"
  (change)="handleChange()"
  (focus)="handleSearch()"
  (angryDelete)="handleAngryDelete()"
/>

<div class="cid-variation-nutrient__delimiter"></div>

<div class="ciui-input-group">
  <ciui-number-input
    label="Nutrient amount"
    labelInvisible
    min="0"
    max="1000"
    step="any"
    theme="white-semi-transparent"
    [formControl]="nutrientForm.controls.amountValue"
    (change)="handleChange()"
  />

  <ciui-select
    label="Nutrient amount unit"
    labelInvisible
    theme="white-semi-transparent"
    [formControl]="nutrientForm.controls.amountUnit"
    [options]="units"
    (change)="handleChange()"
  />
</div>

@if (!isNew()) {
  <button
    ciui-button
    class="cid-variation-nutrient__remove"
    icon="close"
    size="small"
    transparent
    [loading]="isLoading()"
    (click)="fridgeService.removeVariationNutrient(nutrientInput().id)"
  ></button>
}
