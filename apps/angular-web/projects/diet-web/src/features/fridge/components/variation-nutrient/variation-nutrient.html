<ciui-select
  #nutrientName
  label="Nutrient name"
  name="name"
  placeholder="Nutrient name"
  labelInvisible
  row
  theme="white-semi-transparent"
  labelKey="name"
  [options]="nutrientsSearchStore.foundNutrients() ?? []"
  [optionsLoading]="nutrientsSearchStore.loading()"
  [formControl]="nutrient.controls.core"
  (searchedDebounced)="handleSearch($event)"
  (change)="handleChange()"
  (focus)="handleSearch()"
  (angryDelete)="handleAngryDelete()"
/>

<div class="cid-variation-nutrient__delimiter"></div>

<ciui-input-select
  label="Nutrient amount"
  labelSelect="Nutrient unit"
  labelInvisible
  name="amount"
  type="number"
  step="any"
  min="0"
  max="1000"
  row
  theme="white-semi-transparent"
  class="cid-variation-nutrient__amount"
  [formControl]="nutrient.controls.amount"
  [options]="units"
  (change)="handleChange()"
/>

@if (!isNew()) {
  <button
    ciui-button
    class="cid-variation-nutrient__remove"
    icon="close"
    size="small"
    transparent
    [loading]="isLoading()"
    (click)="fridgeService.removeVariationNutrient(nutrientInput().id)"
  ></button>
}
