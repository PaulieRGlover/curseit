<div class="ciui-card__content">
  <div
    class="cid-food-list-item__name"
    [class.cid-food-list-item__name--absent]="!food().name"
  >{{ food().name ? food().name : 'Unnamed food' }}</div>

  <div class="cid-food-list-item__description ciui-ellipsis" [attr.title]="food().description">
    <span class="ciui-ellipsis__text">{{ food().description }}</span>
  </div>

  <div class="cid-food-list-item__portions">
    @for (portion of portions(); track portion.id) {
      <div class="cid-food-list-item__portion-wrapper">
        <cid-portion-badge
          [counter]="portion.counter"
          [freshness]="portion.freshness"
          [remaining]="portion.remainingInGrams / portion.sizeInGrams * 100"
        />
      </div>
    }
  </div>
</div>
