<div class="ciui-card__tabs">
  <a
    class="ciui-card__tab"
    [class.ciui-card__tab--active]="isInfoActive()"
    [routerLink]="getInfoNavigation()"
  >Info & Variations</a>
  <a
    class="ciui-card__tab"
    [class.ciui-card__tab--active]="isPortionsActive()"
    [routerLink]="getPortionsNavigation()"
  >Portions</a>
</div>

<div class="ciui-card__actions">
  <button
    ciui-button
    icon="star"
    size="medium"
    priority="tertiary"
    (click)="handleFavorite()"
  ></button>

  <button
    ciui-button
    icon="trashcan"
    size="medium"
    priority="tertiary"
    (click)="handleRemove()"
  ></button>
</div>

<div class="ciui-card__content">
  <router-outlet />
</div>
