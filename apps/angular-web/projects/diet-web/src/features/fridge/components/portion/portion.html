@let variations_ = variationsStore.variations()!;

<cid-portion-badge
  ciui-context-menu-trigger
  trigger="click"
  [freshness]="portionInput().freshness"
  [counter]="counter.value"
  [remaining]="remaining()"
/>

<ciui-context-menu
  #contextMenu
  menuTitle="Select counter emoji"
  closable
  [width]="387"
>
  <div class="ciui-context-menu__content">
    @if (_contextMenuRef().isOpen()) {
      <cid-emoji-picker (pick)="handleEmojiPick($event)" />
    }
  </div>
</ciui-context-menu>

<ciui-select
  label="Variation"
  labelInvisible
  theme="white"
  labelKey="name"
  placeholder="Select food variation"
  [options]="variations_"
  [formControl]="portionForm.controls.variation"
  (change)="handleChange()"
/>

<ciui-date-input
  label="Food added on"
  labelInvisible
  theme="white"
  type="date"
  [formControl]="portionForm.controls.dateAdded"
  (change)="handleChange()"
/>

<ciui-date-input
  label="Food expiring on"
  labelInvisible
  theme="white"
  type="date"
  [formControl]="portionForm.controls.dateExpiring"
  [min]="portionForm.controls.dateAdded.value"
  (change)="handleChange()"
/>

<div class="ciui-input-group">
  <ciui-number-input
    label="Size"
    labelInvisible
    theme="white"
    min="0"
    max="1000"
    step="any"
    [formControl]="portionForm.controls.portionSizeValue"
    (change)="handleChange()"
  />

  <ciui-select
    label="Size unit"
    labelInvisible
    theme="white"
    [options]="foodSizeOptions"
    [formControl]="portionForm.controls.portionSizeUnit"
    (change)="handleChange()"
  />
</div>

<div class="ciui-input-group">
  <ciui-number-input
    label="Remaining"
    labelInvisible
    theme="white"
    min="0"
    max="1000"
    step="any"
    [formControl]="portionForm.controls.remainingValue"
    (change)="handleChange()"
  />

  <ciui-select
    label="Remaining size unit"
    labelInvisible
    theme="white"
    [options]="foodSizeOptions"
    [formControl]="portionForm.controls.remainingUnit"
    (change)="handleChange()"
  />
</div>

@if (isPortionLoading()) {
  <div class="cid-portion__loader-wrapper">
    <ciui-loader />
  </div>
} @else {
  <ciui-checkbox
    label="Select portion"
    labelInvisible
    name="portion-selected"
    transparent
    row
    theme="white"
    [value]="selected()"
    (change)="selectToggled.emit()"
  />
}

@if (isCooking()) {
  @if (isPortionLoading()) {
    <div class="cid-portion__loader-wrapper">
      <ciui-loader />
    </div>
  } @else {
    <ciui-checkbox
      label="Select portion for cooking"
      labelInvisible
      name="portion-selected-for-cooking"
      transparent
      row
      theme="white"
      mark="🍳"
      [value]="selectedForCooking()"
      (change)="selectForCookingToggled.emit()"
    />
  }
}
