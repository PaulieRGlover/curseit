@let variations_ = variationsStore.variations()!;

<cid-portion-badge
  ciui-context-menu-trigger
  trigger="click"
  [freshness]="portionInput().freshness"
  [counter]="counter.value"
  [remaining]="remainingInPercent()"
/>

<ciui-context-menu
  #contextMenu
  menuTitle="Select counter emoji"
  closable
  [width]="387"
>
  <div class="ciui-context-menu__content">
    @if (_contextMenuRef().isOpen()) {
      <cid-emoji-picker (pick)="handleEmojiPick($event)" />
    }
  </div>
</ciui-context-menu>

<ciui-select
  label="Variation"
  labelInvisible
  theme="white"
  labelKey="name"
  placeholder="Select food variation"
  [options]="variations_"
  [formControl]="portionForm.controls.variation"
  (change)="handleChange()"
/>

<ciui-date-input
  label="Food added on"
  labelInvisible
  theme="white"
  type="date"
  [formControl]="portionForm.controls.dateAdded"
  (change)="handleChange()"
/>

<ciui-date-input
  label="Food expiring on"
  labelInvisible
  theme="white"
  type="date"
  [formControl]="portionForm.controls.dateExpiring"
  [min]="portionForm.controls.dateAdded.value"
  (change)="handleChange()"
/>

<ciui-input-select
  label="Size"
  labelInvisible
  labelSelect="Size unit"
  type="number"
  row
  theme="white"
  min="0"
  max="1000"
  step="any"
  [options]="foodSizeOptions"
  [formControl]="portionForm.controls.portionSize"
  (change)="handleChange()"
/>

<ciui-input-select
  label="Remaining"
  labelInvisible
  labelSelect="Remaining unit"
  type="number"
  row
  theme="white"
  min="0"
  max="1000"
  step="any"
  [options]="foodSizeOptions"
  [formControl]="portionForm.controls.remaining"
  (change)="handleChange()"
/>

@if (isPortionLoading()) {
  <div class="cid-portion__loader-wrapper">
    <ciui-loader />
  </div>
} @else {
  <ciui-checkbox
    label="Select portion"
    labelInvisible
    name="portion-selected"
    transparent
    row
    theme="white"
    [formControl]="selectedControl"
    (change)="selectToggled.emit()"
  />
}
