<div class="ciui-card__content">
  @if (foodStore.loading()) {
  <ciui-loader class="ciui-food-full__loader" theme="white" size="big" />
  } @else if (notFound()) {
  Food not found
  } @else if (foodStore.failure()) {
  Something went wrong
  } @else {
  <cid-basic-information />

  <cid-variations />
  }
</div>
