<ciui-select
  label="Nutrient name"
  name="name"
  placeholder="Name"
  labelInvisible
  row
  transparent
  size="small"
  labelKey="name"
  [options]="nutrientsSearchStore.foundNutrients() ?? []"
  [formControl]="name"
  (searchDebounced)="handleSearchDebounced($event)"
  (change)="handleInputChange()"
/>

<div class="cid-food-nutrient__delimiter"></div>

<ciui-input-select
  label="Nutrient amount"
  labelSelect="Nutrient unit"
  labelInvisible
  name="amount"
  type="number"
  row
  transparent
  size="small"
  class="cid-food-nutrient__amount"
  [formControl]="value"
  [options]="valueOptions"
  (change)="handleInputChange()"
/>

@if (!isNew()) {
  <ciui-icon
    name="close"
  />
}
