@let variations_ = variationsStore.variations();

@if (variations_) {
  <ciui-select
    label="Variation"
    row
    theme="white-semi-transparent"
    labelKey="name"
    editable
    selectOnAdd
    placeholder="Select food variation"
    [options]="variations_"
    [formControl]="variation"
    (change)="handleVariationChange()"
    (add)="handleVariationAdd($event)"
    (remove)="handleVariationRemove($event)"
    (edit)="handleVariationEdit($event)"
  />

  <cid-variation />
} @else {
  <ciui-loader />
}
